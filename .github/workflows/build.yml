name: Build and release PixNexa

# One workflow builds every PixNexa app with the same version number:
#   PixNexa Desktop (Windows)  PixNexa_Setup.exe, PixNexa_Portable.zip
#   PixNexa Mobile (Android)   PixNexa.apk, PixNexa-<version>.apk, PixNexa-<version>.aab
# A push to main (or a vX.Y.Z tag) publishes all of them, plus SHA256SUMS.txt, in ONE GitHub Release.
# Pull requests and other branches only build; the files are kept as run artifacts for 14 days.

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
      - "site/**"
      - ".github/workflows/pages.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/dependabot.yml"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
      - "site/**"
      - ".github/workflows/pages.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/dependabot.yml"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"

permissions:
  contents: write

# A newer push to the same branch makes an older, still-running build pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      code: ${{ steps.ver.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      # main -> MAJOR.MINOR.<run>; tag vX.Y.Z -> X.Y.Z; other branches -> MAJOR.MINOR.0-dev.<run>.
      # Android's versionCode must always grow; 1000 + run number stays above the old android-v1.0.N builds.
      - id: ver
        run: |
          version=$(python3 tools/set_version.py --ci "$GITHUB_REF" "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER")
          echo "Building PixNexa $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

  windows:
    name: PixNexa Desktop (Windows)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt pyinstaller

      # FFmpeg (a pinned BtbN GPL build, checksum-verified) is shipped next to PixNexa.exe as a separate program.
      # It is fetched first so the tests below run the video, audio and HEIC tests with the same ffmpeg.exe.
      - name: Download FFmpeg
        shell: pwsh
        run: |
          ./tools/fetch_ffmpeg.ps1 -Dest "$env:RUNNER_TEMP\ffmpeg"
          "PIXNEXA_FFMPEG=$env:RUNNER_TEMP\ffmpeg\ffmpeg.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run tests
        run: python -m pytest -q

      # The same version string goes into the app header / About, the exe properties and the installer.
      - name: Write the version
        run: python tools/set_version.py ${{ needs.version.outputs.version }}

      # Engines import their libraries lazily, so every package with plug-ins, data files or DLLs is collected.
      - name: Build exe
        run: >-
          pyinstaller --noconfirm --onedir --windowed --name PixNexa --icon assets/icon.ico
          --version-file version_info.txt --add-data "assets;assets"
          --collect-all customtkinter --collect-all tkinterdnd2
          --collect-submodules pixnexa_engines --hidden-import self_test
          --collect-all pi_heif --collect-all pypdfium2 --collect-all pypdfium2_raw --collect-all pikepdf
          --collect-all py7zr --collect-submodules fontTools --collect-submodules markdown
          --collect-submodules pysubs2 --collect-submodules openpyxl
          --hidden-import brotli --hidden-import yaml --hidden-import tomli_w
          image_converter_gui.py

      - name: Bundle FFmpeg and the license notices
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force "$env:RUNNER_TEMP\ffmpeg" dist\PixNexa\ffmpeg
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md dist\PixNexa\
          if (-not (Test-Path dist\PixNexa\ffmpeg\ffmpeg.exe)) { throw "ffmpeg.exe is missing from dist\PixNexa\ffmpeg" }
          Get-ChildItem dist\PixNexa\ffmpeg

      # The frozen app must find every engine and the bundled FFmpeg: --self-test converts tiny samples, no window.
      - name: Check the built app
        shell: pwsh
        run: |
          $env:PIXNEXA_FFMPEG = ""          # the app must find dist\PixNexa\ffmpeg\ffmpeg.exe by itself
          $report = Join-Path $env:TEMP "PixNexa-self-test.txt"
          Remove-Item $report -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath dist\PixNexa\PixNexa.exe -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow
          Get-Content $report -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Self-test failed (exit code $($p.ExitCode))" }
          if (-not (Select-String -Path $report -SimpleMatch "PixNexa\ffmpeg\ffmpeg.exe" -Quiet)) { throw "The bundled FFmpeg was not used" }

      # Inno Setup is preinstalled on GitHub's Windows runners; install it only if it is ever missing.
      - name: Make sure Inno Setup is available
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found" }

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ needs.version.outputs.version }} installer.iss'

      - name: Zip portable version
        run: Compress-Archive -Path dist\PixNexa -DestinationPath PixNexa_Portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            Output/PixNexa_Setup.exe
            PixNexa_Portable.zip
          retention-days: 14

  android:
    name: PixNexa Mobile (Android)
    needs: version
    runs-on: ubuntu-latest
    env:
      # Release key from Settings -> Secrets and variables -> Actions (see android/README.md).
      PIXNEXA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      PIXNEXA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      PIXNEXA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare the signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pixnexa-release.jks"
            echo "PIXNEXA_KEYSTORE=$RUNNER_TEMP/pixnexa-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the APK is signed with a temporary debug key. See android/README.md."
          fi

      - name: Build APK and App Bundle
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease bundleRelease -PversionCode=${{ needs.version.outputs.code }} -PversionName=${{ needs.version.outputs.version }}

      - name: Collect the files
        run: |
          v=${{ needs.version.outputs.version }}
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk "out/PixNexa-$v.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/PixNexa-$v.aab"
          cp "out/PixNexa-$v.apk" out/PixNexa.apk
          rm -f "$RUNNER_TEMP/pixnexa-release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/
          retention-days: 14

  release:
    name: Publish
    needs: [version, windows, android]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # upload-artifact keeps sub-folders (e.g. Output/PixNexa_Setup.exe); the release wants a flat list.
      - name: Create checksums
        working-directory: dist
        run: |
          find . -mindepth 2 -type f -exec mv {} . \;
          find . -mindepth 1 -type d -empty -delete
          ls -la
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PixNexa-${{ needs.version.outputs.version }}
          path: dist/
          retention-days: 14

      # Builds of main and develop get a git tag with their version, e.g. v2.1.40 or v2.1.0-dev.12.
      - name: Tag this build
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        run: |
          tag="v${{ needs.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists, skipping"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "PixNexa $tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi

      # Public releases only from main and from version tags.
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: PixNexa v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          generate_release_notes: true
          body: |
            ## Downloads

            | App | File |
            | --- | ---- |
            | **PixNexa Desktop** (Windows 10/11) | `PixNexa_Setup.exe` (installer) or `PixNexa_Portable.zip` (no installation) |
            | **PixNexa Mobile** (Android 7.0+) | `PixNexa.apk` (open it on your phone and allow installing from this source) |
            | **PixNexa Web** | No download: https://usef-farahmand.github.io/image-format-converter/#convert |

            `PixNexa-${{ needs.version.outputs.version }}.aab` is the Android App Bundle for app stores. Verify downloads with `SHA256SUMS.txt`.
            Install guide: https://usef-farahmand.github.io/image-format-converter/#install
          files: dist/*
