name: Build Windows EXE and Release (PixNexa Desktop)

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
      - "android/**"
      - "site/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/pages.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/dependabot.yml"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
      - "android/**"
      - "site/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/pages.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/dependabot.yml"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"

permissions:
  contents: write

# A newer push to the same branch makes an older, still-running build pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt pyinstaller

      - name: Run tests
        run: python -m pytest -q

      # One version number for everything: app header / About, exe properties, installer and release name.
      - name: Decide the version
        id: ver
        shell: bash
        run: |
          version=$(python tools/set_version.py --ci "$GITHUB_REF" "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER")
          echo "Building PixNexa Desktop $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build exe
        run: pyinstaller --noconfirm --onedir --windowed --name PixNexa --icon assets/icon.ico --version-file version_info.txt --add-data "assets;assets" --collect-all customtkinter --collect-all tkinterdnd2 image_converter_gui.py

      # Inno Setup is preinstalled on GitHub's Windows runners; install it only if it is ever missing.
      - name: Make sure Inno Setup is available
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found" }

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.ver.outputs.version }} installer.iss'

      - name: Zip portable version
        run: Compress-Archive -Path dist\PixNexa -DestinationPath PixNexa_Portable.zip

      - name: Create checksums
        run: |
          Get-FileHash Output\PixNexa_Setup.exe, PixNexa_Portable.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content -Encoding ascii SHA256SUMS.txt

      # Every build (develop, pull requests, main, tags) keeps its output for two weeks:
      # Actions -> the run -> Artifacts.
      - uses: actions/upload-artifact@v4
        with:
          name: PixNexa_Setup
          path: Output/PixNexa_Setup.exe
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: PixNexa_Portable
          path: PixNexa_Portable.zip
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: SHA256SUMS.txt
          retention-days: 14

      # Every build of a branch (main, develop or a manual run) gets a git tag with its version,
      # e.g. v2.0.37 or v2.0.0-dev.12. Pull requests and builds triggered by a tag are not tagged again.
      - name: Tag this build
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/')
        shell: bash
        run: |
          tag="v${{ steps.ver.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists, skipping"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "PixNexa Desktop $tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi

      # Public GitHub Releases are published only from main and from version tags.
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ format('v{0}', steps.ver.outputs.version) }}
          name: PixNexa Desktop ${{ format('v{0}', steps.ver.outputs.version) }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            Output/PixNexa_Setup.exe
            PixNexa_Portable.zip
            SHA256SUMS.txt
