name: Build Android APK

# Every push builds PixNexa Mobile. A push to main also publishes a GitHub Release with the APK.
on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional release key (Settings -> Secrets and variables -> Actions). See android/README.md.
      PIXNEXA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      PIXNEXA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      PIXNEXA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # main -> 1.0.<run>; other branches and pull requests -> 1.0.<run>-dev. versionCode is the run number.
      - name: Decide the version
        id: ver
        shell: bash
        run: |
          base=$(cut -d. -f1-2 android/VERSION)
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            version="$base.$GITHUB_RUN_NUMBER"
          else
            version="$base.$GITHUB_RUN_NUMBER-dev"
          fi
          echo "Building PixNexa Mobile $version (versionCode $GITHUB_RUN_NUMBER)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare the signing key
        id: sign
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pixnexa-release.jks"
            echo "PIXNEXA_KEYSTORE=$RUNNER_TEMP/pixnexa-release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the APK is signed with a temporary debug key. Users will have to uninstall it before installing a build signed with another key. See android/README.md."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK and App Bundle
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease bundleRelease -PversionCode=${{ github.run_number }} -PversionName=${{ steps.ver.outputs.version }}

      - name: Collect the files
        shell: bash
        run: |
          v=${{ steps.ver.outputs.version }}
          mkdir dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/PixNexa-$v.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/PixNexa-$v.aab"
          cp "dist/PixNexa-$v.apk" dist/PixNexa.apk
          (cd dist && sha256sum PixNexa-$v.apk PixNexa-$v.aab PixNexa.apk > SHA256SUMS-android.txt)
          cat dist/SHA256SUMS-android.txt
          rm -f "$RUNNER_TEMP/pixnexa-release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: PixNexa-${{ steps.ver.outputs.version }}
          path: dist/
          retention-days: 14

      # Android releases are tagged android-v1.0.N and never marked "latest", so the
      # latest-release link of PixNexa Desktop (Windows) keeps pointing at the Windows build.
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.ver.outputs.version }}
          name: PixNexa Mobile v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: "false"
          generate_release_notes: true
          body: |
            **PixNexa Mobile ${{ steps.ver.outputs.version }}** for Android 7.0 and newer.

            Download **`PixNexa.apk`** on your phone, open it and allow installing apps from this source.
            Installation guide: https://usef-farahmand.github.io/image-format-converter/#install

            `PixNexa-${{ steps.ver.outputs.version }}.aab` is the App Bundle for app stores. Checksums are in `SHA256SUMS-android.txt`.
            ${{ steps.sign.outputs.signed == 'false' && '> Note: this build is signed with a temporary key. If an older PixNexa is installed and the update fails, uninstall it first.' || '' }}
          files: |
            dist/PixNexa.apk
            dist/PixNexa-${{ steps.ver.outputs.version }}.apk
            dist/PixNexa-${{ steps.ver.outputs.version }}.aab
            dist/SHA256SUMS-android.txt
