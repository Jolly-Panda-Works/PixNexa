name: Build Windows EXE and Release

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/dependabot.yml"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/dependabot.yml"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"

permissions:
  contents: write

# A newer push to the same branch makes an older, still-running build pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt pyinstaller

      - name: Run tests
        run: python -m pytest -q

      # One version number for everything: app header / About, exe properties, installer and release name.
      - name: Decide the version
        id: ver
        shell: bash
        run: |
          version=$(python tools/set_version.py --ci "$GITHUB_REF" "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER")
          echo "Building Image Format Converter $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build exe
        run: pyinstaller --noconfirm --onedir --windowed --name ImageFormatConverter --icon assets/icon.ico --version-file version_info.txt --add-data "assets;assets" --collect-all customtkinter --collect-all tkinterdnd2 image_converter_gui.py

      # Inno Setup is preinstalled on GitHub's Windows runners; install it only if it is ever missing.
      - name: Make sure Inno Setup is available
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found" }

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.ver.outputs.version }} installer.iss'

      - name: Zip portable version
        run: Compress-Archive -Path dist\ImageFormatConverter -DestinationPath ImageFormatConverter_Portable.zip

      - name: Create checksums
        run: |
          Get-FileHash Output\ImageFormatConverter_Setup.exe, ImageFormatConverter_Portable.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content -Encoding ascii SHA256SUMS.txt

      # Every build (develop, pull requests, main, tags) keeps its output for two weeks:
      # Actions -> the run -> Artifacts.
      - uses: actions/upload-artifact@v4
        with:
          name: ImageFormatConverter_Setup
          path: Output/ImageFormatConverter_Setup.exe
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: ImageFormatConverter_Portable
          path: ImageFormatConverter_Portable.zip
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: SHA256SUMS.txt
          retention-days: 14

      # Public GitHub Releases are published only from main and from version tags.
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ format('v{0}', steps.ver.outputs.version) }}
          name: Image Format Converter ${{ format('v{0}', steps.ver.outputs.version) }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            Output/ImageFormatConverter_Setup.exe
            ImageFormatConverter_Portable.zip
            SHA256SUMS.txt
